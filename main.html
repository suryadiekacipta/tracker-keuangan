<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="image/wallet.png" />
    <link rel="stylesheet" href="main.css" />
    <title>Expense Tracker</title>
  </head>
  <body>
    <main>
      <section class="dashboard">
        <header>
          <img src="image/wallet.png" alt="Wallet Icon" />
          <h1>Expense Tracker</h1>
        </header>

        <section class="dashboard-options">
          <div class="div1">
            <img src="image/home.png" alt="Dashboard Icon" />
            <h3>Dashboard</h3>
          </div>

          <div class="div2">
            <img src="image/transaction-history.png" />
            <h3>Transactions</h3>
          </div>

          <div class="div3">
            <img src="image/subfolder.png" />
            <h3>Categories</h3>
          </div>

          <div class="div4">
            <img src="image/bar-chart.png" alt="Reports Icon" />
            <h3>Reports</h3>
          </div>

          <div class="div5">
            <img src="image/settings.png" alt="Settings Icon" />
            <h3>Settings</h3>
          </div>
        </section>

        <section class="dashboard-info">
          <img src="image/wallet2.png" />
          <h2>Kelola Keuanganmu</h2>
          <p>
            Cari setiap pemasukan<br />dan pengeluaranmu dengan<br />mudah dan
            terorisasi
          </p>
        </section>
        <button class="logout"><img src="image/logout.png" />Log Out</button>
      </section>
    </main>
  </body>
</html>
